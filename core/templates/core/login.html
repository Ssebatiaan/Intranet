{% extends "core/base.html" %}

{% block title %}Iniciar sesión · Intranet{% endblock %}

{% block content %}
  <div class="auth-card">
    <h1 class="page-title" style="font-size:1.4rem;">Iniciar sesión</h1>
    {% if form.errors %}
      <p style="color:#a33;">Usuario o contraseña incorrectos.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-field">
        <label for="id_username">Usuario</label>
        {{ form.username }}
      </div>
      <div class="form-field">
        <label for="id_password">Contraseña</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn-intranet">Entrar</button>
    </form>
  </div>
{% endblock %}
