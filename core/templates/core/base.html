{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Intranet{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  {% if user.is_authenticated %}
  <header class="navbar-intranet">
    <div class="page" style="display:flex; align-items:center; justify-content:space-between; padding-top:0; padding-bottom:0;">
      <a class="brand" href="{% url 'home' %}">Intranet</a>
      <nav class="nav-links">
        <span>{{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn-intranet" style="padding:0.35rem 0.8rem; font-size:0.85rem; margin-left:1rem;">Salir</button>
        </form>
      </nav>
    </div>
  </header>
  {% endif %}

  <main class="page">
    {% if messages %}
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
